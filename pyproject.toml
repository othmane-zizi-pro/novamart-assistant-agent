[project]
name = "novamart-assistant"
version = "0.1.0"
description = "Internal support assistant for NovaMart store employees"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.133",
    "uvicorn[standard]>=0.30",
    "google-genai~=2.19",
    "google-adk~=2.7",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
